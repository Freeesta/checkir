<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>%APP_NAME%</title>
  <meta id="meta-description" name="description" content="%DESCRIPTION%">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfe">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1521">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="%APP_NAME%">
  <meta property="og:title" content="%APP_NAME%">
  <meta property="og:description" content="%DESCRIPTION%">
  <meta property="og:url" content="%SITE_URL%">
  <meta property="og:image" content="%SITE_URL%img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="it_IT">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%APP_NAME%">
  <meta name="twitter:description" content="%DESCRIPTION%">
  <meta name="twitter:image" content="%SITE_URL%img/og.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <div id="splash" role="status">
    <span class="sr-only" id="splash-label"></span>
    <svg class="splash-art" viewBox="0 0 320 80" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="splash-env" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="300" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.96" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="splash-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="80"><rect x="0" y="0" width="320" height="80" fill="url(#splash-env)"/></mask>
        <radialGradient id="splash-glow"><stop class="splash-glow-in" offset="0"/><stop class="splash-glow-out" offset="1"/></radialGradient>
      </defs>
      <g mask="url(#splash-mask)"><path class="splash-wave" d="M-40 40 Q-30 -4 -20 40 T0 40 T20 40 T40 40 T60 40 T80 40 T100 40 T120 40 T140 40 T160 40 T180 40 T200 40 T220 40 T240 40 T260 40 T280 40 T300 40 T320 40 T340 40 T360 40"/></g>
      <circle class="splash-halo" cx="292" cy="40" r="14" fill="url(#splash-glow)"/>
      <circle class="splash-head" cx="292" cy="40" r="4"/>
    </svg>
  </div>
  <a class="skip" href="#main-content" data-i18n="app.skip"></a>
  <header class="app-header" id="app-header"></header>
  <div class="shell">
    <aside class="panel" id="panel"></aside>
    <main id="main-content">
      <div class="workbar" id="workbar">
        <div class="toolbar" id="chart-toolbar"></div>
      </div>
      <section id="chart-section" aria-labelledby="chart-title">
        <div class="title-row"><h2 id="chart-title" data-i18n="chart.title"></h2><span id="chart-help"></span></div>
        <p id="peaks-summary" class="peaks-summary" hidden></p>
        <div id="chart" tabindex="0" role="group" data-i18n-aria="chart.title"></div>
        <p id="range" aria-live="polite"></p>
      </section>
      <section id="peak-card" class="peak-card" aria-labelledby="peak-card-title" hidden></section>
      <section id="subtract" hidden aria-labelledby="subtract-title"></section>
      <div class="limits" id="limits" role="note"></div>
      <section id="table-section" aria-labelledby="table-title">
        <h2 id="table-title" data-i18n="table.title"></h2>
        <div id="table" class="scroll" tabindex="0" role="region" data-i18n-aria="table.region"></div>
      </section>
    </main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <footer class="footer"><p id="footer-name"></p></footer>
  <section class="sheet-host" id="sheet-host"></section>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <script type="module" src="main.js"></script>
</body>
</html>
