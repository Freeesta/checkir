<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>%APP_NAME%</title>
  <meta id="meta-description" name="description" content="%DESCRIPTION%">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121417">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="%APP_NAME%">
  <meta property="og:title" content="%APP_NAME%">
  <meta property="og:description" content="%DESCRIPTION%">
  <meta property="og:url" content="%SITE_URL%">
  <meta property="og:image" content="%SITE_URL%img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="it_IT">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="%APP_NAME%">
  <meta name="twitter:description" content="%DESCRIPTION%">
  <meta name="twitter:image" content="%SITE_URL%img/og.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main-content" data-i18n="app.skip"></a>
  <header class="app-header" id="app-header"></header>
  <div class="shell">
    <aside class="panel" id="panel"></aside>
    <main id="main-content">
      <div class="workbar" id="workbar">
        <div class="toolbar" id="chart-toolbar"></div>
      </div>
      <section aria-labelledby="chart-title">
        <div class="title-row"><h2 id="chart-title" data-i18n="chart.title"></h2><span id="chart-help"></span></div>
        <div id="chart" tabindex="0" role="group" data-i18n-aria="chart.title"></div>
        <p id="range" aria-live="polite"></p>
      </section>
      <div class="limits" id="limits" role="note"></div>
      <section aria-labelledby="table-title">
        <h2 id="table-title" data-i18n="table.title"></h2>
        <div id="table" class="scroll" tabindex="0" role="region" data-i18n-aria="table.region"></div>
      </section>
    </main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <footer class="footer">
    <nav class="footer-links" data-i18n-aria="footer.nav_label">
      <a href="pagine/avvertenze/" data-i18n="footer.link_warnings"></a>
      <a href="pagine/informativa/" data-i18n="footer.link_notice"></a>
    </nav>
    <p data-i18n="footer.notice"></p>
    <p id="engine-version"></p>
  </footer>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <script type="module" src="main.js"></script>
</body>
</html>
