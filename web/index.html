<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>FTIR</title>
  <link rel="icon" type="image/png" sizes="16x16" href="img/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main-content" data-i18n="app.skip"></a>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1 id="app-name"></h1>
        <p data-i18n="app.tagline"></p>
      </div>
    </div>
    <label class="language">
      <span data-i18n="lang.label"></span>
      <select id="language">
        <option value="it" data-i18n="lang.it"></option>
        <option value="en" data-i18n="lang.en"></option>
      </select>
    </label>
  </header>
  <main id="main-content">
    <section aria-labelledby="chart-title">
      <h2 id="chart-title" data-i18n="chart.title"></h2>
      <p data-i18n="chart.description"></p>
      <div class="toolbar" id="chart-toolbar"></div>
      <div id="chart" tabindex="0" role="group" data-i18n-aria="chart.title"></div>
      <p class="help" data-i18n="chart.help"></p>
      <p id="range" aria-live="polite"></p>
    </section>
    <section aria-labelledby="table-title">
      <h2 id="table-title" data-i18n="table.title"></h2>
      <div id="table" class="scroll" tabindex="0" role="region" data-i18n-aria="table.region"></div>
    </section>
  </main>
  <footer class="footer">
    <p data-i18n="footer.notice"></p>
    <p id="engine-version"></p>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
