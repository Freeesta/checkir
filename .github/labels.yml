# Labels of the repository, as data. The workflow `labels` (labels.yml) creates or updates them; it never deletes any.
# The only issue form (bug) applies `bug`; the others sort issues and pull requests.
- {name: bug, color: "d73a4a", description: "Something does not work or a text is wrong / Qualcosa non funziona o un testo è sbagliato"}
- {name: sheet, color: "0e8a16", description: "Substance sheet / Scheda di sostanza"}
- {name: spectrum, color: "1d76db", description: "Reference spectrum / Spettro di riferimento"}
- {name: alert, color: "b60205", description: "Alert about a substance or family / Allerta su una sostanza o famiglia"}
- {name: translation, color: "5319e7", description: "Translation / Traduzione"}
- {name: triage, color: "fbca04", description: "Not yet sorted by a maintainer / Non ancora smistata"}
- {name: urgent, color: "b60205", description: "To be sorted within 48 hours / Da smistare entro 48 ore"}
- {name: blocked, color: "000000", description: "Cannot go on until something else is done / Non può proseguire finché non si risolve altro"}
- {name: conduct, color: "8a6cc9", description: "Code of Conduct matter / Questione di codice di condotta"}
- {name: "lang:it", color: "ededed", description: "Italian / Italiano"}
- {name: "lang:en", color: "ededed", description: "English / Inglese"}
