name: "Correct a substance sheet / Correggi una scheda"
description: "Propose a correction to one section of a substance sheet. / Proponi la correzione di una sezione di una scheda."
labels: ["sheet", "proposal", "needs-review"]
body:
  - type: markdown
    attributes:
      value: "**Everything you write here is PUBLIC. Do not write data about people, precise places, vendors or venues. / Tutto ciò che scrivi qui è PUBBLICO. Non scrivere dati di persone, luoghi precisi, venditori o locali.** Every statement needs a source, and a reviewer listed in data/reviewers.json approves the text before publication. / Ogni affermazione richiede una fonte e un revisore elencato in data/reviewers.json approva il testo prima della pubblicazione."
  - type: input
    id: substance
    attributes:
      label: "Substance id / Id della sostanza"
      description: "The folder name under data/substances/, e.g. synthetic-a. / Il nome della cartella in data/substances/."
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: "Section / Sezione"
      options:
        - "molecule"
        - "category"
        - "history"
        - "origin"
        - "metabolism"
        - "cuts"
        - "effects"
        - "doses"
        - "risks"
        - "interactions"
        - "counselling"
        - "sources"
        - "license"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: "Language of the text / Lingua del testo"
      options:
        - "en"
        - "it"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Sheet version you read / Versione della scheda letta"
      description: "Shown on the sheet. / Indicata sulla scheda."
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: "Proposed text / Testo proposto"
      description: "Short sentences, one fact each, each ending with [f:source-id] or a new source below. Never \"safe\", \"pure\" or \"clean\". / Frasi brevi, un fatto ciascuna, ognuna con [f:id-fonte] o una fonte nuova qui sotto. Mai «sicuro», «puro», «pulito»."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Sources, DOI or URL (required) / Fonti, DOI o URL (obbligatorie)"
    validations:
      required: true
  - type: input
    id: public_name
    attributes:
      label: "Name for the credits (optional, public; a pseudonym is fine) / Nome per i crediti (facoltativo, pubblico; va bene uno pseudonimo)"
  - type: checkboxes
    id: declarations
    attributes:
      label: "Declarations / Dichiarazioni"
      options:
        - label: "The text contains no personal data, no synthesis, extraction or cutting instructions, and no vendors or places to buy. / Il testo non contiene dati personali, istruzioni di sintesi, estrazione o taglio, né venditori o luoghi d'acquisto."
          required: true
        - label: "I certify the Developer Certificate of Origin 1.1 (https://developercertificate.org/): I have the right to submit this. / Certifico il Developer Certificate of Origin 1.1: ho il diritto di inviare questo contributo."
          required: true
        - label: "I wrote it or have the right to publish it, and I agree to CC BY-SA 4.0. / L'ho scritto io o ho il diritto di pubblicarlo, e accetto la licenza CC BY-SA 4.0."
          required: true
