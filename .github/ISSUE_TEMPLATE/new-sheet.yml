name: "Propose a new substance sheet / Proponi una nuova scheda"
description: "Ask for a sheet of a substance that is missing. / Chiedi la scheda di una sostanza che manca."
labels: ["sheet", "new-sheet", "needs-review"]
body:
  - type: markdown
    attributes:
      value: "**Everything you write here is PUBLIC. Do not write data about people, precise places, vendors or venues. / Tutto ciò che scrivi qui è PUBBLICO. Non scrivere dati di persone, luoghi precisi, venditori o locali.**"
  - type: input
    id: name
    attributes:
      label: "Name of the substance / Nome della sostanza"
    validations:
      required: true
  - type: input
    id: identifiers
    attributes:
      label: "Identifiers (PubChem CID, Wikidata Q-id, InChIKey) / Identificativi (PubChem CID, Wikidata Q-id, InChIKey)"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Why is it needed? / Perché serve?"
      description: "For example how often it is found in your service, or a recent alert. No places, dates more precise than a month, or people. / Per esempio quanto spesso compare nel tuo servizio o un'allerta recente. Niente luoghi, date più precise del mese, persone."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Sources, DOI or URL / Fonti, DOI o URL"
  - type: input
    id: public_name
    attributes:
      label: "Name for the credits (optional, public; a pseudonym is fine) / Nome per i crediti (facoltativo, pubblico; va bene uno pseudonimo)"
  - type: checkboxes
    id: declarations
    attributes:
      label: "Declarations / Dichiarazioni"
      options:
        - label: "The text contains no personal data, no synthesis, extraction or cutting instructions, and no vendors or places to buy. / Il testo non contiene dati personali, istruzioni di sintesi, estrazione o taglio, né venditori o luoghi d'acquisto."
          required: true
        - label: "I certify the Developer Certificate of Origin 1.1 (https://developercertificate.org/): I have the right to submit this. / Certifico il Developer Certificate of Origin 1.1: ho il diritto di inviare questo contributo."
          required: true
        - label: "I wrote it or have the right to publish it, and I agree to CC BY-SA 4.0. / L'ho scritto io o ho il diritto di pubblicarlo, e accetto la licenza CC BY-SA 4.0."
          required: true
