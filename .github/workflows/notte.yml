# Level 3 of the tests: once a day on main and by hand at the end of a large package.
# Everything that is too slow for the pull requests: other operating systems, all browsers, the full e2e suite, fuzzing at a fixed time.
# Not a required check: a red night is fixed the next day by ONE chat chosen by the Coordinator.
name: notte

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo test --locked --release
  browsers:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps ${{ matrix.browser }}
      - run: bash tools/costruisci_sito.sh
      - run: BROWSER=${{ matrix.browser }} node tests_e2e/fumo.mjs
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      # A fixed time per reader; a crash found here becomes a case of tests/robustness.rs. Never a gate of the pull requests.
      - run: for t in jcamp text spa spc; do cargo +nightly fuzz run "$t" -- -max_total_time=120; done
  # One issue per sheet whose review deadline is within 30 days (label `expiring`) or past (label `expired`): updated, never duplicated,
  # closed when the sheet is renewed. Only this job may write issues.
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 tools/signatures/run_expiry.py "$REPO"
