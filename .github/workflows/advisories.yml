# Security advisories (RustSec) of the dependencies. The list changes every day, so this is NOT part of the pull requests
# (ci-ok covers licences and sources): it runs every day and by hand, and it is red when a new advisory appears.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
