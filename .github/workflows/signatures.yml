# Required check `signatures`: a pull request that changes a substance sheet needs the approvals of the right reviewers.
# Safety rules: events `pull_request` and `pull_request_review` only (NEVER `pull_request_target` with a checkout of the fork);
# read-only permissions; the script is checked out at the BASE commit, so a pull request cannot change the rules that judge it;
# only metadata and file contents are read through the API; nothing from the pull request is interpolated into `run:`.
name: signatures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Approvals, roles, versions and dates of the changed sheets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # the base commit of the very pull request that introduces the check does not have the script yet
          if [ ! -f tools/signatures/check_signatures.py ]; then echo "signatures: script not in the base commit, skipped"; exit 0; fi
          python3 tools/signatures/check_signatures.py "$REPO" "$NUMBER"
