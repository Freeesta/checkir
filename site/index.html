<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>checkir</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <a class="salta" href="#principale" data-i18n="app.skip"></a>
  <header class="testata">
    <div>
      <h1 id="nome-app"></h1>
      <p data-i18n="app.tagline"></p>
    </div>
    <label class="lingua">
      <span data-i18n="lang.label"></span>
      <select id="lingua">
        <option value="it" data-i18n="lang.it"></option>
        <option value="en" data-i18n="lang.en"></option>
      </select>
    </label>
  </header>
  <main id="principale">
    <section aria-labelledby="titolo-grafico">
      <h2 id="titolo-grafico" data-i18n="grafico.titolo"></h2>
      <p data-i18n="grafico.descrizione"></p>
      <div class="barra" id="barra-grafico"></div>
      <div id="grafico" tabindex="0" role="group" data-i18n-aria="grafico.titolo"></div>
      <p class="aiuto" data-i18n="grafico.aiuto"></p>
      <p id="intervallo" aria-live="polite"></p>
    </section>
    <section aria-labelledby="titolo-tabella">
      <h2 id="titolo-tabella" data-i18n="tabella.titolo"></h2>
      <div id="tabella" class="scorri" tabindex="0" role="region" data-i18n-aria="tabella.regione"></div>
    </section>
  </main>
  <footer class="pie">
    <p data-i18n="pie.avviso"></p>
    <p id="versione-motore"></p>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
